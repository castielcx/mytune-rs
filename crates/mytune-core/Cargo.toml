[package]
name = "mytune-core"
version.workspace = true
edition.workspace = true

[features]
# Builds and embeds the DLL that goes into explorer.exe (src/taskbar.rs). Off in the public setup.
taskbar-look = []
# Licence key check against the key server (src/license.rs). In the public setup only.
license = ["dep:ed25519-dalek", "dep:sha2", "dep:base64"]

[dependencies]
# versions already in Cargo.lock
ed25519-dalek = { version = "2", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = "2"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Devices_Display",
  "Win32_Graphics_Dwm",
  "Win32_System_Memory",
  "Win32_UI_ColorSystem",
  "Win32_UI_Shell",
  "Win32_UI_Input",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_WinRT",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Time",
  "Win32_System_Performance",
  "Win32_System_Diagnostics_Etw",
  "Win32_System_RemoteDesktop",
  "Win32_System_ProcessStatus",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_WiFi",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_TaskScheduler",
  "Win32_System_Variant",
  "Win32_System_SystemInformation",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
cc = "1" # finds MSVC for the taskbar DLL

[dev-dependencies]
tempfile = "3"
