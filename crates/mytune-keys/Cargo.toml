[package]
name = "mytune-keys"
version.workspace = true
edition.workspace = true

[dependencies]
# All already in Cargo.lock at these versions.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "clipboard", "default_fonts"] }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
getrandom = "0.2"
base64 = "0.22"
